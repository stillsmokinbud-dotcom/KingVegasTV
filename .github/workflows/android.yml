# Builds the Android app (Android TV, Fire TV, Google TV, phones, tablets) on every push to main
# and publishes it as the newest GitHub Release, so the Downloader code always installs the latest build.
# Stable download link for Downloader codes:
#   https://github.com/<you>/<repo>/releases/latest/download/KingVegasTV.apk
name: Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Restore signing key (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/novatv.jks"
            echo "NOVATV_KEYSTORE_FILE=$RUNNER_TEMP/novatv.jks" >> "$GITHUB_ENV"
          else
            echo "No KEYSTORE_BASE64 secret: signing with the debug key."
          fi

      - name: Build APK
        env:
          NOVATV_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          NOVATV_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          NOVATV_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          NOVATV_SERVER_URL: ${{ vars.LICENSE_SERVER_URL }}
        run: |
          gradle --no-daemon assembleRelease
          cp app/build/outputs/apk/release/*.apk KingVegasTV.apk

      - uses: actions/upload-artifact@v4
        with:
          name: KingVegasTV-apk
          path: KingVegasTV.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: King Vegas TV build ${{ github.run_number }}
          files: KingVegasTV.apk
          make_latest: true
          generate_release_notes: true
